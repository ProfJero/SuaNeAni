<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>SuaNeAni Admin</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #f6f7f5; }
    [hidden] { display: none !important; }
    .nav-btn.active { background: #1a5f4a; color: #fff; }
    .nav-btn.active .badge { background: #f5a623; color: #1f2937; }
  </style>
</head>
<body class="text-gray-800 antialiased min-h-screen">

  <!-- Loading -->
  <div id="view-loading" class="min-h-screen flex items-center justify-center text-gray-500">
    <i class="fas fa-circle-notch fa-spin mr-3"></i> Loading…
  </div>

  <!-- Sign in -->
  <div id="view-login" hidden class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 w-full max-w-sm p-8">
      <div class="flex items-center gap-3 mb-6">
        <img src="../images/logo.png" alt="" class="h-10 w-auto" />
        <div>
          <p class="font-extrabold text-lg text-[#1a5f4a] leading-tight">SuaNeAni</p>
          <p class="text-xs text-gray-500">Website admin</p>
        </div>
      </div>
      <form id="login-form" class="space-y-4" novalidate>
        <div>
          <label for="login-email" class="block text-sm font-semibold mb-1">Email</label>
          <input id="login-email" type="email" autocomplete="username" required class="w-full rounded-xl border-gray-200 focus:border-[#1a5f4a] focus:ring-[#1a5f4a]" />
        </div>
        <div>
          <label for="login-password" class="block text-sm font-semibold mb-1">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required class="w-full rounded-xl border-gray-200 focus:border-[#1a5f4a] focus:ring-[#1a5f4a]" />
        </div>
        <p id="login-message" class="text-sm" role="alert" hidden></p>
        <button type="submit" class="w-full rounded-full bg-[#1a5f4a] hover:bg-[#134d3b] text-white font-semibold py-3 disabled:opacity-60">Sign in</button>
        <button type="button" id="forgot-password" class="w-full text-sm text-gray-500 hover:text-[#1a5f4a]">Forgot password?</button>
      </form>
    </div>
  </div>

  <!-- Signed in but not an admin -->
  <div id="view-denied" hidden class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 w-full max-w-md p-8 text-center">
      <div class="w-14 h-14 mx-auto rounded-full bg-red-50 text-red-500 flex items-center justify-center text-xl mb-4"><i class="fas fa-lock"></i></div>
      <h1 class="text-xl font-bold mb-2">No admin access</h1>
      <p class="text-sm text-gray-600 mb-2">You are signed in as <strong id="denied-email"></strong>, but this account has not been made an admin.</p>
      <p class="text-xs text-gray-500 mb-6">Ask the site owner to add your user ID to the <code>admins</code> collection in Firestore. Your user ID is:<br /><code id="denied-uid" class="select-all"></code></p>
      <button type="button" data-signout class="rounded-full border border-gray-300 px-6 py-2 text-sm font-semibold hover:bg-gray-50">Sign out</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="view-app" hidden class="min-h-screen lg:flex">
    <aside class="bg-white border-b lg:border-b-0 lg:border-r border-gray-100 lg:w-64 lg:min-h-screen lg:sticky lg:top-0 lg:h-screen flex flex-col">
      <div class="flex items-center justify-between gap-3 p-4 lg:p-6">
        <a href="../index.html" class="flex items-center gap-3" target="_blank" rel="noopener" title="Open website">
          <img src="../images/logo.png" alt="" class="h-9 w-auto" />
          <div>
            <p class="font-extrabold text-[#1a5f4a] leading-tight">SuaNeAni</p>
            <p class="text-xs text-gray-500">Website admin</p>
          </div>
        </a>
        <button type="button" id="menu-toggle" class="lg:hidden w-10 h-10 rounded-full hover:bg-gray-100 text-xl text-gray-600" aria-label="Menu"><i class="fas fa-bars"></i></button>
      </div>
      <nav id="nav" class="hidden lg:flex flex-col gap-1 px-3 pb-4 lg:flex-1"></nav>
      <div class="hidden lg:block p-4 border-t border-gray-100 text-xs text-gray-500" id="account-box">
        <p class="truncate mb-2" id="account-email"></p>
        <button type="button" data-signout class="text-[#1a5f4a] font-semibold hover:underline"><i class="fas fa-sign-out-alt mr-1"></i> Sign out</button>
      </div>
    </aside>
    <main class="flex-1 p-4 sm:p-6 lg:p-10 max-w-6xl" id="main"></main>
  </div>

  <!-- Edit dialog -->
  <div id="dialog" hidden class="fixed inset-0 z-50 bg-slate-900/50 flex items-start sm:items-center justify-center p-4 overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl my-8">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
        <h2 id="dialog-title" class="text-lg font-bold"></h2>
        <button type="button" data-dialog-close class="text-gray-400 hover:text-gray-700 text-xl" aria-label="Close"><i class="fas fa-times"></i></button>
      </div>
      <div id="dialog-body" class="p-6"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" hidden class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-gray-900 text-white text-sm rounded-full px-5 py-3 shadow-lg"></div>

  <script type="module" src="admin.js"></script>
</body>
</html>
