<!-- header.html -->
<style>
  /* mobile slide-in menu */
  .mobile-menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    backdrop-filter: blur(4px);
  }
  .mobile-menu-overlay.open {
    opacity: 1;
    visibility: visible;
  }
  .mobile-menu-panel {
    position: fixed;
    top: 0;
    right: -320px;
    width: 300px;
    max-width: 80vw;
    height: 100%;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 110;
    padding: 2rem 1.5rem;
    transition: right 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: -8px 0 30px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .mobile-menu-panel.open {
    right: 0;
  }
  .mobile-menu-panel .close-btn {
    align-self: flex-end;
    font-size: 1.8rem;
    color: #1e293b;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0 0.5rem;
  }
  .mobile-menu-panel a {
    font-weight: 500;
    color: #1e293b;
    padding: 0.6rem 0.8rem;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    transition: background 0.15s;
    font-size: 1rem;
  }
  .mobile-menu-panel a:hover {
    background: #fef3c7;
    color: #d97706;
  }
  .mobile-menu-panel a i {
    width: 1.5rem;
    color: #f5a623;
  }
  .mobile-menu-panel .donate-mobile {
    margin-top: auto;
    background: #f5a623;
    color: white !important;
    border-radius: 40px;
    justify-content: center;
    padding: 0.9rem;
    font-weight: 600;
  }
  .mobile-menu-panel .donate-mobile i {
    color: white;
  }
  .mobile-menu-panel .donate-mobile:hover {
    background: #d97706;
  }
  body.no-scroll { overflow: hidden; }
  
  /* Active nav link styling */
  .nav-link-active {
    color: #F5A623 !important;
    border-bottom: 2px solid #F5A623;
    padding-bottom: 0.25rem;
  }
  .nav-link-inactive {
    color: #4B5563 !important;
    border-bottom: 2px solid transparent;
    padding-bottom: 0.25rem;
  }
  .nav-link-inactive:hover {
    color: #F5A623 !important;
  }
  
  /* Mobile active link styling */
  .mobile-link-active {
    color: #F5A623 !important;
    font-weight: 600 !important;
    background-color: #fef3c7 !important;
  }
  .mobile-link-inactive {
    color: #1e293b !important;
    font-weight: 500 !important;
    background-color: transparent !important;
  }

  /* ===== GLASS HEADER STYLES ===== */
  .glass-header {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    z-index: 9999 !important;
    
    background: rgba(255, 255, 255, 0.72) !important;
    backdrop-filter: blur(20px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
    
    border-bottom: 1px solid rgba(255, 255, 255, 0.3) !important;
    box-shadow: 
      0 4px 30px rgba(0, 0, 0, 0.05),
      inset 0 1px 0 rgba(255, 255, 255, 0.6) !important;
    
    transition: all 0.3s ease !important;
    transform: translateZ(0) !important;
    will-change: transform !important;
  }

  .glass-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.5) 0%,
      rgba(255, 255, 255, 0.1) 100%
    );
    pointer-events: none;
    z-index: -1;
  }

  .header-container {
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }

  @media (max-width: 768px) {
    .header-container {
      padding: 0.5rem 1rem;
    }
  }

  .brand-text {
    color: #F5A623 !important;
    font-weight: 700 !important;
    letter-spacing: -0.5px !important;
  }

  .brand-text:hover {
    color: #E0951A !important;
  }

  .glass-mobile-menu {
    background: rgba(255, 255, 255, 0.95) !important;
    backdrop-filter: blur(24px) saturate(200%) !important;
    -webkit-backdrop-filter: blur(24px) saturate(200%) !important;
    border-right: 1px solid rgba(255, 255, 255, 0.2) !important;
  }

  .donate-btn-glass {
    background: linear-gradient(135deg, #F5A623, #E0951A) !important;
    color: white !important;
    padding: 0.5rem 1.25rem !important;
    border-radius: 9999px !important;
    font-weight: 700 !important;
    font-size: 0.875rem !important;
    display: flex !important;
    align-items: center !important;
    gap: 0.5rem !important;
    transition: all 0.3s ease !important;
    box-shadow: 0 4px 15px rgba(245, 166, 35, 0.3) !important;
    border: 1px solid rgba(255, 255, 255, 0.2) !important;
  }

  .donate-btn-glass:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 8px 25px rgba(245, 166, 35, 0.4) !important;
    background: linear-gradient(135deg, #E0951A, #D4880F) !important;
  }

  .glass-nav-link {
    position: relative;
    padding: 0.25rem 0.5rem;
    transition: all 0.3s ease;
    border-radius: 8px;
  }

  .glass-nav-link:hover {
    background: rgba(245, 166, 35, 0.08);
    backdrop-filter: blur(4px);
  }

  .hamburger-btn {
    background: rgba(255, 255, 255, 0.5) !important;
    backdrop-filter: blur(8px) !important;
    -webkit-backdrop-filter: blur(8px) !important;
    border-radius: 12px !important;
    padding: 0.5rem 0.75rem !important;
    border: 1px solid rgba(255, 255, 255, 0.3) !important;
    transition: all 0.3s ease !important;
  }

  .hamburger-btn:hover {
    background: rgba(255, 255, 255, 0.8) !important;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05) !important;
  }

  body {
    padding-top: 80px !important;
  }

  @media (max-width: 768px) {
    body {
      padding-top: 72px !important;
    }
  }

  /* ===== DROPDOWN STYLES (only for Partners) ===== */
  .dropdown-group {
    position: relative;
  }
  .dropdown-menu {
    position: absolute;
    left: 0;
    margin-top: 0.5rem;
    width: 220px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 0.5rem 0;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px);
    transition: all 0.2s ease;
    z-index: 999;
  }
  .dropdown-group:hover .dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .dropdown-menu a {
    display: block;
    padding: 0.5rem 1rem;
    color: #374151;
    font-size: 0.875rem;
    font-weight: 500;
    transition: all 0.15s;
    border-bottom: none !important;
  }
  .dropdown-menu a:hover {
    background: #fef3c7;
    color: #d97706;
  }
  .dropdown-trigger {
    cursor: default;
  }
  .dropdown-trigger i {
    font-size: 10px;
    margin-left: 4px;
    transition: transform 0.2s;
  }
  .dropdown-group:hover .dropdown-trigger i {
    transform: rotate(180deg);
  }
  .dropdown-menu.wide {
    width: 260px;
  }
</style>

<script>
  // ============================================================
  // 1. MOBILE MENU (event delegation)
  // ============================================================
  document.addEventListener('click', function(e) {
    var openBtn = e.target.closest('#menu-open');
    if (openBtn) {
      e.preventDefault();
      var overlay = document.getElementById('mobile-overlay');
      var panel = document.getElementById('mobile-panel');
      if (overlay) overlay.classList.add('open');
      if (panel) panel.classList.add('open');
      if (document.body) document.body.classList.add('no-scroll');
      return;
    }

    var closeBtn = e.target.closest('#close-mobile');
    if (closeBtn) {
      e.preventDefault();
      var overlay = document.getElementById('mobile-overlay');
      var panel = document.getElementById('mobile-panel');
      if (overlay) overlay.classList.remove('open');
      if (panel) panel.classList.remove('open');
      if (document.body) document.body.classList.remove('no-scroll');
      return;
    }

    var overlayEl = e.target.closest('#mobile-overlay');
    if (overlayEl && overlayEl.classList.contains('open')) {
      var panelEl = document.getElementById('mobile-panel');
      overlayEl.classList.remove('open');
      if (panelEl) panelEl.classList.remove('open');
      if (document.body) document.body.classList.remove('no-scroll');
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      var overlay = document.getElementById('mobile-overlay');
      var panel = document.getElementById('mobile-panel');
      if (overlay && overlay.classList.contains('open')) {
        overlay.classList.remove('open');
        if (panel) panel.classList.remove('open');
        if (document.body) document.body.classList.remove('no-scroll');
      }
    }
  });

  // ============================================================
  // 2. ACTIVE TAB – universal, handles all pages
  // ============================================================
  function setActiveTab() {
    var path = window.location.pathname;
    var currentPage = path.split('/').pop() || 'index.html';
    var pageName = currentPage.replace('.html', '');

    var partnerPages = [
      'partners-development.html',
      'partners-education.html',
      'partners-publishers.html',
      'partners-technology.html'
    ];
    var isPartnerPage = partnerPages.includes(currentPage);

    // ----- Desktop: top-level nav (data-page) -----
    document.querySelectorAll('#main-nav a[data-page]').forEach(function(link) {
      var linkPage = link.getAttribute('data-page');
      link.classList.remove('nav-link-active', 'nav-link-inactive');
      if (linkPage === pageName) {
        link.classList.add('nav-link-active');
      } else {
        link.classList.add('nav-link-inactive');
      }
    });

    // ----- Desktop: Partners dropdown trigger (by ID) -----
    var partnersTrigger = document.getElementById('partners-dropdown-trigger');
    if (partnersTrigger) {
      partnersTrigger.classList.remove('text-[#f5a623]', 'border-b-2', 'border-[#f5a623]', 'nav-link-active', 'nav-link-inactive');
      if (isPartnerPage) {
        partnersTrigger.classList.add('text-[#f5a623]', 'border-b-2', 'border-[#f5a623]');
      } else {
        partnersTrigger.classList.add('nav-link-inactive');
      }
    }

    // ----- Desktop: highlight the specific partner link in the dropdown -----
    document.querySelectorAll('#main-nav .dropdown-menu a').forEach(function(link) {
      link.classList.remove('bg-[#fef3c7]', 'text-[#d97706]', 'font-semibold');
      if (isPartnerPage && link.getAttribute('href') === currentPage) {
        link.classList.add('bg-[#fef3c7]', 'text-[#d97706]', 'font-semibold');
      }
    });

    // ----- Mobile: data-page links -----
    document.querySelectorAll('#mobile-panel a[data-page]').forEach(function(link) {
      var linkPage = link.getAttribute('data-page');
      link.classList.remove('mobile-link-active', 'mobile-link-inactive');
      if (linkPage === pageName) {
        link.classList.add('mobile-link-active');
      } else {
        link.classList.add('mobile-link-inactive');
      }
    });

    // ----- Mobile: partner links (no data-page) -----
    document.querySelectorAll('#mobile-panel a').forEach(function(link) {
      var href = link.getAttribute('href');
      if (partnerPages.includes(href)) {
        link.classList.remove('mobile-link-active', 'mobile-link-inactive');
        if (href === currentPage) {
          link.classList.add('mobile-link-active');
        } else {
          link.classList.add('mobile-link-inactive');
        }
      }
    });
  }

  // ============================================================
  // 3. INIT
  // ============================================================
  function initHeader() {
    console.log('Header initialised');
    setActiveTab();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initHeader);
  } else {
    initHeader();
  }

  window.addEventListener('popstate', function() {
    setTimeout(setActiveTab, 100);
  });

  window.setActiveTab = setActiveTab;
  window.initHeader = initHeader;
</script>
